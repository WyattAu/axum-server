[package]
name = "axum-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Axum server utilities — shutdown, CORS, request ID, health routes, middleware stack"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/axum-server"

[dependencies]
axum = "0.8"
tower = "0.5"
tower-layer = "0.3"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "request-id", "timeout"] }
http = "1"
tokio = { version = "1", features = ["signal", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
healthkit = { path = "../healthkit" }
shutdown-kit = { path = "../graceful" }
thiserror = "2"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

[lints.rust]
unsafe_code = "forbid"
